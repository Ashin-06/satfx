[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "satfx"
version = "1.0.0"
description = "Forensics of satellite messaging on phones, with orbital corroboration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "sgp4>=2.23",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# skyfield is an independent astronomy library; the tests cross-check the orbit code against it
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.0", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7", "skyfield>=1.48"]

[project.scripts]
satfx = "satfx.cli:main"

[tool.setuptools]
packages = ["satfx"]

[tool.setuptools.package-data]
satfx = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.coverage.run]
source = ["satfx"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I001"]
ignore = ["B008", "B905", "E731"]  # Depends() defaults are FastAPI's idiom; zip(strict=) and lambdas are style
